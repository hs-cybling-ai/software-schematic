name: DiagramStudio
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  DiagramStudio:
    type: application
    platform: macOS
    sources:
      - path: DiagramStudio/Sources/DiagramStudio
        excludes:
          - Resources
      - path: DiagramStudio/Sources/DiagramStudio/Resources/Web
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: Build bundled web editor
        script: scripts/build-web-assets.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Verify bundled web editor layout
        script: |
          set -eu
          web_root="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Web"
          test -f "$web_root/index.html"
          test -d "$web_root/assets"
          test -n "$(find "$web_root/assets" -name 'index-*.js' -print -quit)"
          test -n "$(find "$web_root/assets" -name 'index-*.css' -print -quit)"
          ! grep -q 'type="module"' "$web_root/index.html"
          ! grep -q 'crossorigin' "$web_root/index.html"
          grep -q '<script defer ' "$web_root/index.html"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harlanshober.DiagramStudio
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: DiagramStudio/DiagramStudio.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  DiagramStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DiagramStudio/Tests/DiagramStudioTests]
    dependencies:
      - target: DiagramStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DiagramStudioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [DiagramStudio/UITests/DiagramStudioUITests]
    dependencies:
      - target: DiagramStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
