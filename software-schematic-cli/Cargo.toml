[package]
name = "software-schematic-cli"
version = "0.1.7"
edition = "2024"
description = "Project-local software schematic editor"
license = "MIT"

[[bin]]
name = "ss"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
