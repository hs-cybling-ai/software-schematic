[package]
name = "software-schematic-cli"
version = "0.1.7"
edition = "2024"
description = "Project-local software schematic editor"
license = "MIT"

[[bin]]
name = "ss"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
grafeo = { version = "0.5.42", default-features = false, features = ["lpg", "ai", "embed"] }
grafeo-engine = { version = "0.5.42", default-features = false, features = ["lpg", "gql", "ai", "embed"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
include_dir = "0.7"
open = "5.3"
quick-xml = "0.38"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time", "io-std"] }
toml_edit = "0.23"
tower-http = { version = "0.6", features = ["fs", "trace"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
